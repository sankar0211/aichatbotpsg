services:
  - type: web
    name: psg-ai-chatbot
    env: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn -w 1 run:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
